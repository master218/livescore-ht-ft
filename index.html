<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore HT-FT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080e08;color:#fff;font-family:Arial}
header{position:sticky;top:0;z-index:100;background:#0a130a;border-bottom:2px solid #00c853;padding:8px}
.logo{font-weight:900;color:#00e676}
.ad{background:#101f10;border:1px dashed #2e7d32;margin:8px;padding:8px;text-align:center;color:#66bb6a;font-size:12px;border-radius:8px}
.days{display:flex;gap:6px;overflow:auto;padding:8px 0}
.day{min-width:70px;padding:8px;background:#122112;border-radius:10px;text-align:center;cursor:pointer;border:1px solid #1d331d}
.day.active{background:#00c853;color:#000;font-weight:800}
.filters{display:flex;gap:6px;overflow:auto;padding:6px 0}
.fbtn{padding:6px 12px;background:#162616;border-radius:20px;cursor:pointer;border:1px solid #244524;font-size:12px;white-space:nowrap}
.fbtn.active{background:#fff;color:#000;font-weight:700}
.leagueHead{background:#0e1e0e;padding:8px 10px;margin-top:10px;border-left:4px solid #00c853;display:flex;justify-content:space-between;font-size:13px}
.match{display:flex;align-items:center;padding:10px 8px;background:#111f11;margin:1px 0;cursor:pointer}
.match:hover{background:#1a2f1a}
.timeCol{width:55px;font-size:13px;color:#a5d6a7;text-align:center}
.teamCol{flex:1;padding-left:10px}
.scoreCol{min-width:50px;text-align:right;font-weight:900;color:#00e676}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;justify-content:center;align-items:center;padding:12px}
#modalBox{background:#0f1f0f;border:2px solid #00c853;border-radius:14px;width:100%;max-width:400px}
.tab{display:flex}
.tab div{flex:1;padding:10px;text-align:center;background:#162616;cursor:pointer;font-size:13px}
.tab div.active{background:#1e331e;border-bottom:2px solid #00c853;font-weight:700}
.content{padding:14px}
</style>
</head>
<body>
<header>
<div class="logo">⚽ LiveScore HT-FT</div>
<div class="ad">AD SPACE TOP</div>
<div class="days" id="days"></div>
<div class="filters">
<div class="fbtn active" data-f="all" onclick="setF('all')">All Games</div>
<div class="fbtn" data-f="live" onclick="setF('live')">Live</div>
<div class="fbtn" data-f="finished" onclick="setF('finished')">Finished</div>
<div class="fbtn" onclick="loadMatches()">↻ Refresh</div>
<select id="sortSel" onchange="render()"><option value="top">Top 1-10</option><option value="az">A-Z</option></select>
</div>
</header>
<div class="ad">AD SPACE MID</div>
<div id="list"></div>
<div class="ad">AD SPACE BOTTOM</div>
<div id="modal" onclick="if(event.target==this)closeModal()"><div id="modalBox"></div></div>

<script>
const TOP = ["champions league","europa league","conference league","premier league","ligue 1","bundesliga","serie a","la liga","eredivisie","primeira liga"];
let curDate=new Date().toISOString().split('T')[0], filter='all', allMatches=[];

function loadDays(){
 let d=document.getElementById('days'); d.innerHTML='';
 for(let i=-4;i<=4;i++){
  let dt=new Date(); dt.setDate(dt.getDate()+i);
  let iso=dt.toISOString().split('T')[0];
  let label=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':dt.toLocaleDateString('en',{weekday:'short'});
  d.innerHTML+=`<div class="day ${iso===curDate?'active':''}" onclick="pickDate('${iso}')"><b>${label}</b><br><small>${iso.slice(5)}</small></div>`;
 }
}
function pickDate(iso){curDate=iso; loadDays(); loadMatches();}
function setF(f){filter=f; document.querySelectorAll('.fbtn[data-f]').forEach(b=>b.classList.remove('active')); document.querySelector(`[data-f="${f}"]`).classList.add('active'); render();}
async function loadMatches(){
 document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';
 let r=await fetch(`/api/matches?date=${curDate}`); let j=await r.json();
 allMatches=j.data?.matches||[];
 render();
}
function getTime(utc){ try{ return new Date(utc).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}); }catch{return utc?.slice(11,16)||'--:--';} }
function getRank(n){ n=n.toLowerCase(); for(let i=0;i<TOP.length;i++) if(n.includes(TOP[i])) return i; return 99; }

function render(){
 let sort=document.getElementById('sortSel').value;
 let filtered=allMatches.filter(m=>{ if(filter==='finished'&&m.status!=='finished')return false; if(filter==='live'&&!m.isLive)return false; return true; });
 let grouped={}; filtered.forEach(m=>{ let k=`${m.league.country}::${m.league.name}`; if(!grouped[k]) grouped[k]=[]; grouped[k].push(m); });
 let keys=Object.keys(grouped);
 if(sort==='az') keys.sort((a,b)=>a.localeCompare(b));
 else keys.sort((a,b)=> getRank(a)-getRank(b) || a.localeCompare(b));
 let html='';
 keys.forEach(k=>{
  let [c,l]=k.split('::'); let ms=grouped[k];
  html+=`<div class="leagueHead"><span>${c} - ${l} (${ms.length})</span><span style="color:#66bb6a">Standings >></span></div><div>`;
  ms.forEach(m=>{
   let idx=allMatches.indexOf(m);
   let time=getTime(m.time);
   // MAIN PAGE SHOW ONLY FT - NO HT HERE
   let ftDisplay = m.status==='finished' ? `${m.home.score} - ${m.away.score}` : '-';
   html+=`<div class="match" onclick="openMatch(${idx})"><div class="timeCol">${time}</div><div class="teamCol"><div>${m.home.name}</div><div>${m.away.name}</div></div><div class="scoreCol">${ftDisplay}</div></div>`;
  });
  html+=`</div>`;
 });
 document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center">No matches</div>';
}

function openMatch(idx){
 let m=allMatches[idx];
 let ft = m.status==='finished'? `${m.home.score} - ${m.away.score}` : 'Not started';
 let ht = (m.ht && m.ht.home!=null)? `${m.ht.home} - ${m.ht.away}` : 'No HT data';
 let htft = (m.ht && m.status==='finished')? `${m.ht.home}-${m.ht.away} / ${m.home.score}-${m.away.score}` : '-';
 let time=getTime(m.time);
 document.getElementById('modalBox').innerHTML=`
  <div class="tab"><div class="active">Results - FT & HT</div></div>
  <div class="content">
   <h3 style="text-align:center">${m.home.name} vs ${m.away.name}</h3>
   <p style="text-align:center;color:#81c784;font-size:12px">${m.league.country} - ${m.league.name}<br>${time} - ${m.status}</p>
   <div style="background:#081208;padding:12px;border-radius:10px;margin-top:12px">
    <div style="display:flex;justify-content:space-between;padding:10px 0"><span>FT Result:</span><b style="color:#00e676;font-size:20px">${ft}</b></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #1a331a"><span>HT Result:</span><b style="color:#ff9800;font-size:20px">${ht}</b></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #1a331a"><span>HT / FT:</span><b>${htft}</b></div>
   </div>
   <div style="margin-top:12px;text-align:center;color:#66bb6a;font-size:11px">Click outside to close</div>
  </div>`;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
loadDays(); loadMatches();
</script>
</body>
</html>
