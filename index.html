<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore HT-FT</title>
<style>
body{margin:0;background:#0f1a0f;color:#fff;font-family:Arial}
.top{background:#00c853;color:#000;padding:10px;text-align:center;font-weight:bold}
.head{background:#1a2e1a;padding:10px;display:flex;justify-content:space-between;align-items:center}
.days{display:flex;gap:6px;overflow:auto;padding:10px;background:#0a1a0a}
.days button{padding:8px 12px;border-radius:10px;border:1px solid #333;background:#1a2e1a;color:#fff;min-width:70px}
.days button.active{background:#00c853;color:#000;font-weight:bold}
.filters{display:flex;gap:8px;padding:10px;background:#0a1a0a}
.filters button{padding:6px 14px;border-radius:20px;border:1px solid #333;background:#1a2e1a;color:#fff}
.card{background:#1a2e1a;margin:8px;border-radius:8px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center}
.green{color:#00e676;font-weight:bold;font-size:18px}
.detail{display:none;margin-top:8px;border-top:1px solid #2a4a2a;padding-top:8px;font-size:13px;background:#0f2810;border-radius:6px;padding:8px}
</style>
</head>
<body>
<div class="top">AD ON TOP - CLICK</div>
<div class="head"><span>⚽ LiveScore HT-FT</span><span>TOP 1-10</span></div>
<div class="days">
<button onclick="load('2026-10-15')">Thu<br>10-15</button>
<button onclick="load('2026-10-16')">Fri<br>10-16</button>
<button onclick="load('2026-10-17')">Sat<br>10-17</button>
<button class="active" onclick="load('2026-05-12')">Yesterday<br>10-18</button>
</div>
<div class="filters"><button>All</button><button>Live</button><button>Finished</button></div>
<div id="list" style="padding:10px">Loading...</div>

<script>
function toggle(i){
  var d=document.getElementById('det-'+i);
  d.style.display = d.style.display==='none' ? 'block' : 'none';
}
async function load(date){
  var list=document.getElementById('list');
  list.innerHTML='Loading '+date+'...';
  try{
    var res=await fetch('/api?date='+date);
    if(!res.ok){ res=await fetch('/matches?date='+date); }
    var games=await res.json();
    if(!games.length){ list.innerHTML='No games for '+date; return; }
    var html='';
    var lastLeague='';
    for(var i=0;i<games.length;i++){
      var g=games[i];
      if(g.league!==lastLeague){
        html+='<div style="background:#102010;padding:8px;font-weight:bold;border-left:4px solid #00c853;margin-top:12px">'+g.league+'</div>';
        lastLeague=g.league;
      }
      html+='<div class="card" onclick="toggle('+i+')"><div class="row"><span>-</span><span style="flex:1;margin-left:10px">'+g.home+'<br>'+g.away+'</span><span class="green">'+g.ft+'</span></div><div id="det-'+i+'" class="detail"><div>⏰ Time: <b>'+g.time+'</b></div><div>HT: <b>'+g.ht+'</b></div><div>FT: <b>'+g.ft+'</b></div><div>Status: '+g.status+'</div></div></div>';
    }
    list.innerHTML=html;
  }catch(e){ list.innerHTML='Error: '+e.message; }
}
load('2026-05-12');
</script>
</body>
</html>
