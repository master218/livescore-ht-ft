<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livescore HT FT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0e14;color:#fff;font-family:Arial}.top{padding:12px;background:#0f131d;border-bottom:1px solid #1c2132;display:flex;justify-content:space-between;position:sticky;top:0}.top b{color:#00e676}.refresh{background:#1a1f2f;border:1px solid #00e676;color:#00e676;border-radius:20px;padding:6px 12px;font-weight:900}.days{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid #1c2132}.d{padding:7px 12px;border-radius:20px;background:#1a1f2f;color:#8a8fa3;border:1px solid #242b40;font-size:11px;white-space:nowrap}.d.active{background:#00e676;color:#000}.count{padding:8px 12px;color:#5a6075;font-size:10px}.league{background:#1a1f2f;padding:9px 12px;color:#00e676;font-weight:900;font-size:11px;border-top:1px solid #242b40}.match{display:flex;padding:10px 12px;background:#0f131d;border-bottom:1px solid #1c2132}.time{width:55px;font-size:11px;color:#8a8fa3}.teams{flex:1}.team{font-size:12px;line-height:18px}.score{width:60px;text-align:right;font-weight:900}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:none;overflow:auto}.modal.open{display:block}.modal-box{background:#0f131d;min-height:100vh}.modal-top{padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #1c2132;position:sticky;top:0;background:#0f131d}.close{background:#1a1f2f;border:1px solid #242b40;color:#fff;border-radius:20px;padding:5px 12px}.box{margin:10px;background:#151a27;border:1px solid #242b40;border-radius:10px;padding:12px;text-align:center}</style></head><body><div class="top"><b>Livescore HT+FT</b><button class="refresh" onclick="load()">↻ Refresh</button></div><div class="days" id="days"></div><div class="count" id="count"></div><div id="list"></div><div id="modal" class="modal" onclick="if(event.target==this)closeM()"><div class="modal-box"><div class="modal-top"><b id="mTitle"></b><button class="close" onclick="closeM()">✕ Close</button></div><div id="mBody"></div></div></div><script>let cur=new Date().toISOString().split('T')[0],all=[];function days(){let h='',d=new Date();for(let i=-3;i<=3;i++){let dt=new Date();dt.setDate(d.getDate()+i);let iso=dt.toISOString().split('T')[0];let lab=i==0?'Today':i==-1?'Yesterday':i==1?'Tomorrow':iso.slice(5);h+=`<button class="d ${iso==cur?'active':''}" onclick="pick('${iso}')">${lab}</button>`;}document.getElementById('days').innerHTML=h;}function pick(d){cur=d;days();load();}async function load(){let el=document.getElementById('list');el.innerHTML='<div style="padding:30px;text-align:center;color:#5a6075">Loading HT FT...</div>';try{let r=await fetch('/api/matches?date='+cur,{cache:'no-store'});let j=await r.json();all=j.data?.matches||[];render();}catch(e){el.innerHTML='<div style="padding:30px;text-align:center">Error: '+e.message+'</div>';}}function render(){let g={};all.forEach(m=>{let k=(m.league?.country||'World')+': '+(m.league?.name||'League');if(!g[k])g[k]=[];g[k].push(m);});let html='',total=0;for(let k in g){total+=g[k].length;html+=`<div class="league">${k.toUpperCase()}</div>`;g[k].forEach(m=>{let hs=m.home?.score??'-',as=m.away?.score??'-',ht=`${m.ht?.home??0}-${m.ht?.away??0}`;let safe=JSON.stringify(m).replace(/'/g,"&#39;");html+=`<div class="match" onclick='openM(${safe})'><div class="time">HT ${ht}<br>FT</div><div class="teams"><div class="team">${m.home?.name}</div><div class="team">${m.away?.name}</div></div><div class="score">${hs} - ${as}</div></div>`;});}document.getElementById('count').innerText=total+' matches - '+cur+' - Tap for HT/FT';document.getElementById('list').innerHTML=html||'<div style="padding:30px;text-align:center;color:#5a6075">No matches for '+cur+' - Try Yesterday</div>';}function openM(m){document.getElementById('modal').classList.add('open');document.getElementById('mTitle').innerText=m.home.name+' vs '+m.away.name;let hs=m.home.score,as=m.away.score,hth=m.ht.home,hta=m.ht.away;document.getElementById('mBody').innerHTML=`<div style="padding:16px;text-align:center;background:#1a1f2f"><div style="font-size:11px;color:#8a8fa3">${m.league.country}: ${m.league.name}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><div style="flex:1;font-weight:900">${m.home.name}</div><div style="background:#0b0e14;border:2px solid #00e676;border-radius:10px;padding:8px 14px;font-weight:900">${hs} - ${as}</div><div style="flex:1;font-weight:900">${m.away.name}</div></div></div><div style="padding:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="box"><div style="font-size:10px;color:#8a8fa3">FULL TIME - FT</div><div style="font-size:24px;font-weight:900;margin-top:6px">${hs} - ${as}</div></div><div class="box" style="border-color:#ff9800"><div style="font-size:10px;color:#8a8fa3">HALF TIME - HT</div><div style="font-size:24px;font-weight:900;margin-top:6px;color:#ff9800">${hth} - ${hta}</div></div></div><div class="box" style="text-align:left;font-size:12px;line-height:24px">✅ HT: <b style="color:#ff9800">${hth} - ${hta}</b><br>✅ FT: <b>${hs} - ${as}</b><br>Source: ApiSport HT FT</div></div>`;}function closeM(){document.getElementById('modal').classList.remove('open');}days();load();</script></body></html>
