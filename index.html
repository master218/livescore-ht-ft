<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore HT FT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:Arial;padding:10px}
header{position:sticky;top:0;z-index:10;background:#0f172a;padding:10px 0;border-bottom:1px solid #1e293b}
h1{font-size:18px}
.days{display:flex;gap:8px;overflow:auto;padding:8px 0}
.day{padding:6px 12px;background:#1e293b;border-radius:20px;white-space:nowrap;cursor:pointer}
.day.active{background:#22c55e;color:#000}
.filters{display:flex;gap:8px;padding:8px 0}
.fbtn{padding:6px 12px;background:#1e293b;border-radius:20px;cursor:pointer}
.fbtn.active{background:#fff;color:#000}
.match{background:#1e293b;margin:6px 0;padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.team{flex:1}
.score{font-weight:bold;color:#22c55e}
.country{font-size:12px;color:#94a3b8}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:99;justify-content:center;align-items:center}
#modalBox{background:#1e293b;padding:20px;border-radius:15px;width:90%;max-width:350px;text-align:center}
</style>
</head>
<body>
<header>
<h1>LiveScore - HT FT Results</h1>
<div class="days" id="days"></div>
<div class="filters">
<div class="fbtn active" data-f="all" onclick="setFilter('all')">All games</div>
<div class="fbtn" data-f="finished" onclick="setFilter('finished')">Finished</div>
<div class="fbtn" data-f="live" onclick="setFilter('live')">Live</div>
</div>
</header>
<div id="list"></div>

<div id="modal" onclick="closeModal()"><div id="modalBox"></div></div>

<script>
let curDate = new Date(Date.now()-86400000).toISOString().split('T')[0];
let filter = 'all';
let allMatches=[];

function loadDays(){
 let d=document.getElementById('days'); d.innerHTML='';
 for(let i=-2;i<=2;i++){
  let dt=new Date(); dt.setDate(dt.getDate()+i);
  let iso=dt.toISOString().split('T')[0];
  let label=i===-1?'Yesterday':i===0?'Today':i===1?'Tomorrow':iso.slice(5);
  let active = iso===curDate?'active':'';
  d.innerHTML+=`<div class="day ${active}" onclick="pickDate('${iso}')">${label}<br><small>${iso}</small></div>`;
 }
}
function pickDate(iso){curDate=iso; loadDays(); loadMatches();}
function setFilter(f){filter=f; document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); document.querySelector(`[data-f="${f}"]`).classList.add('active'); render();}

async function loadMatches(){
 document.getElementById('list').innerHTML='Loading...';
 let r=await fetch(`/api/matches?date=${curDate}`);
 let j=await r.json();
 allMatches=j.data?.matches||[];
 render();
}

function render(){
 let list=document.getElementById('list');
 let filtered=allMatches.filter(m=>{
  if(filter==='finished') return m.status==='finished';
  if(filter==='live') return m.isLive;
  return true;
 });
 if(!filtered.length){list.innerHTML='No matches'; return;}
 list.innerHTML=filtered.map((m,i)=>{
  let idx=allMatches.indexOf(m);
  return `<div class="match" onclick="openMatch(${idx})">
   <div class="team"><div class="country">${m.league.country} - ${m.league.name}</div><div>${m.home.name} vs ${m.away.name}</div></div>
   <div class="score">${m.home.score} - ${m.away.score}</div>
  </div>`;
 }).join('');
}

function openMatch(idx){
 let m=allMatches[idx];
 let ft = `${m.home.score} - ${m.away.score}`;
 let ht = (m.ht && m.ht.home!=null) ? `${m.ht.home} - ${m.ht.away}` : null;
 
 document.getElementById('modalBox').innerHTML=`
  <h3 style="margin-bottom:10px">${m.home.name} vs ${m.away.name}</h3>
  <div style="color:#94a3b8;margin-bottom:15px">${m.league.country} - ${m.league.name}<br>${m.status}</div>
  <div style="background:#0f172a;padding:15px;border-radius:10px">
   <div style="color:#22c55e;font-size:22px;font-weight:bold;margin-bottom:10px">FT: ${ft}</div>
   ${ht ? `<div style="color:orange;font-size:20px;font-weight:bold">HT: ${ht}</div>` : `<div style="color:#64748b">HT: No HT data for this league</div>`}
  </div>
  <div style="margin-top:15px;color:#94a3b8;font-size:12px">Click outside to close</div>
 `;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}

loadDays(); loadMatches();
</script>
</body>
</html>
