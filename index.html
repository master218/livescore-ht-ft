el.innerHTML = games.map((g,i)=>`
  <div class="card" onclick="toggle(${i})" style="cursor:pointer">
    <small>${g.league}</small>
    <div class="row" style="display:flex;justify-content:space-between">
      <b>${g.home}<br>${g.away}</b>
      <span style="color:#22c55e;font-weight:bold;font-size:18px">${g.ft}</span>
    </div>
    <div id="det-${i}" style="display:none;margin-top:8px;border-top:1px solid #333;padding-top:6px;font-size:13px">
      <div>⏰ Time: <b>${g.time}</b></div>
      <div>HT: <b>${g.ht}</b></div>
      <div>FT: <b>${g.ft}</b></div>
      <div>Status: ${g.status}</div>
    </div>
  </div>
`).join('');
