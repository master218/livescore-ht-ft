<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore HT FT - Flash Fast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} 
body{background:#070a07;color:#e8f5e9;font-family:-apple-system,BlinkMacSystemFont,Arial;overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:#0b140b;border-bottom:2px solid #00c853;padding:8px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;color:#00e676;font-size:20px;letter-spacing:1px}
.ad{background:#111e11;border:1px dashed #2e7d32;margin:8px;border-radius:8px;padding:12px;text-align:center;color:#66bb6a;font-size:13px}
.days{display:flex;gap:6px;overflow:auto;padding:8px 0;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{min-width:72px;padding:8px 6px;background:#121e12;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #1e331e}
.day.active{background:#00c853;color:#000;font-weight:800;border-color:#00e676}
.day b{display:block;font-size:13px}.day small{font-size:11px;opacity:.8}
.filters{display:flex;gap:6px;overflow:auto;padding:6px 0;align-items:center}
.fbtn{padding:7px 14px;background:#162216;border-radius:20px;cursor:pointer;white-space:nowrap;border:1px solid #263d26;font-size:13px}
.fbtn.active{background:#e8f5e9;color:#000;font-weight:700}
.sort{margin-left:auto;display:flex;gap:5px}
select,input{background:#162216;color:#fff;border:1px solid #2e7d32;border-radius:8px;padding:6px 8px;font-size:12px}
.leagueHead{position:sticky;top:108px;z-index:5;background:#0e1a0e;padding:8px 10px;margin-top:12px;border-left:4px solid #00c853;display:flex;justify-content:space-between;cursor:pointer}
.leagueHead:hover{background:#132913}
.match{background:#111f11;margin:1px 0;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.match:hover{background:#1a2e1a}
.team{flex:1;overflow:hidden}
.tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.country{font-size:11px;color:#81c784}
.scoreBox{text-align:right;min-width:90px}
.ftScore{font-weight:900;color:#00e676;font-size:15px}
.htScore{font-size:11px;color:#ff9800;font-weight:700}
.time{font-size:13px;color:#a5d6a7}
.liveDot{color:#ff1744;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;justify-content:center;align-items:center;padding:10px}
#modalBox{background:#0f1f0f;border:2px solid #00c853;border-radius:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.tab{display:flex}
.tab div{flex:1;padding:12px;text-align:center;cursor:pointer;background:#162216;border-bottom:2px solid transparent}
.tab div.active{background:#1e331e;border-color:#00c853;font-weight:700}
.content{padding:16px}
.btn{padding:10px;background:#00c853;color:#000;border-radius:10px;text-align:center;font-weight:800;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="topbar"><div class="logo">⚽ LiveScore HT-FT</div><div style="font-size:11px;color:#66bb6a">FAST • GREEN • BLACK</div></div>
<div class="ad">AD SPACE TOP - 728x90 - Contact for Ads</div>
<div class="days" id="days"></div>
<div class="filters">
<div class="fbtn active" data-f="all" onclick="setF('all')">All Games</div>
<div class="fbtn" data-f="live" onclick="setF('live')"><span class="liveDot">●</span> Live</div>
<div class="fbtn" data-f="finished" onclick="setF('finished')">Finished</div>
<div class="fbtn" onclick="loadMatches()">↻ Refresh</div>
<div class="sort">
<select id="sortSel" onchange="render()"><option value="top">Top 1-10</option><option value="az">A-Z</option></select>
<input id="search" placeholder="Country/League" oninput="render()" style="width:110px">
</div>
</div>
</header>

<div class="ad">AD SPACE MID - Put your banner here</div>
<div id="list"></div>
<div class="ad" style="margin-top:20px">AD SPACE BOTTOM - Adsense / Banner</div>

<div id="modal" onclick="if(event.target==this)closeModal()"><div id="modalBox"></div></div>

<script>
const TOP_LEAGUES = ["England","Spain","Germany","Italy","France","Brazil","UEFA","England Premier","Spain La Liga","Nigeria"];
let curDate = new Date().toISOString().split('T')[0];
let filter='all', allMatches=[], grouped={};

function loadDays(){
 let d=document.getElementById('days'); d.innerHTML='';
 for(let i=-4;i<=4;i++){
  let dt=new Date(); dt.setDate(dt.getDate()+i);
  let iso=dt.toISOString().split('T')[0];
  let label=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':dt.toLocaleDateString('en',{weekday:'short'});
  let sub = i===-1||i===0||i===1? iso : iso.slice(5);
  d.innerHTML+=`<div class="day ${iso===curDate?'active':''}" onclick="pickDate('${iso}')"><b>${label}</b><small>${sub}</small></div>`;
 }
}
function pickDate(iso){curDate=iso; loadDays(); loadMatches();}
function setF(f){filter=f; document.querySelectorAll('.fbtn').forEach(b=>{if(b.dataset.f) b.classList.remove('active')}); document.querySelector(`[data-f="${f}"]`)?.classList.add('active'); render();}

async function loadMatches(){
 document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">Loading fast... ⚡</div>';
 try{
  let r=await fetch(`/api/matches?date=${curDate}`);
  let j=await r.json();
  allMatches=j.data?.matches||j.matches||[];
 }catch(e){allMatches=[];}
 render();
}

function getLocalTime(utcStr){
 if(!utcStr) return '-';
 try{
  let d=new Date(utcStr);
  return d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Lagos'}) + ` <small style="color:#666">${d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',hour12:true})}</small>`;
 }catch{return utcStr.slice(11,16);}
}

function render(){
 let search=document.getElementById('search').value.toLowerCase();
 let sort=document.getElementById('sortSel').value;
 let filtered=allMatches.filter(m=>{
  if(filter==='finished' && m.status!=='finished') return false;
  if(filter==='live' && !m.isLive) return false;
  if(search && !(`${m.league.country} ${m.league.name} ${m.home.name} ${m.away.name}`.toLowerCase().includes(search))) return false;
  return true;
 });

 // Group by league
 grouped={};
 filtered.forEach(m=>{
  let key=`${m.league.country}::${m.league.name}`;
  if(!grouped[key]) grouped[key]=[];
  grouped[key].push(m);
 });

 let keys=Object.keys(grouped);
 if(sort==='az') keys.sort();
 else keys.sort((a,b)=>{
  let ca=TOP_LEAGUES.findIndex(t=>a.toLowerCase().includes(t.toLowerCase()));
  let cb=TOP_LEAGUES.findIndex(t=>b.toLowerCase().includes(t.toLowerCase()));
  if(ca===-1) ca=99; if(cb===-1) cb=99;
  return ca-cb || a.localeCompare(b);
 });

 let html='';
 keys.forEach(key=>{
  let [country, leagueName]=key.split('::');
  let matches=grouped[key];
  html+=`<div class="leagueHead" onclick="toggleLeague('${key}')"><div><span style="color:#00e676">▼</span> ${country} - ${leagueName} <span style="color:#66bb6a">(${matches.length})</span></div><div style="font-size:11px;color:#81c784">Standings >></div></div><div id="L-${btoa(key)}">`;
  matches.forEach(m=>{
   let idx=allMatches.indexOf(m);
   let isFin=m.status==='finished';
   let ft = isFin? `${m.home.score} - ${m.away.score}` : getLocalTime(m.time);
   let ht = (m.ht && m.ht.home!=null) ? `${m.ht.home}-${m.ht.away}` : '';
   html+=`<div class="match" onclick="openMatch(${idx})">
    <div class="team"><div class="tname">${m.home.name}</div><div class="tname">${m.away.name}</div></div>
    <div class="scoreBox">${isFin? `<div class="ftScore">${ft}</div>${ht? `<div class="htScore">HT ${ht}</div>`:''}` : `<div class="time">${ft}</div>`}${m.isLive?'<div class="liveDot">LIVE</div>':''}</div>
   </div>`;
  });
  html+=`</div>`;
 });
 document.getElementById('list').innerHTML=html||'<div style="padding:30px;text-align:center;color:#66bb6a">No matches - try other date</div>';
}
function toggleLeague(k){ let el=document.getElementById('L-'+btoa(k)); el.style.display= el.style.display==='none'?'block':'block'; }

let curIdx=0;
function openMatch(idx){
 curIdx=idx; let m=allMatches[idx];
 let ft = m.status==='finished'? `${m.home.score} - ${m.away.score}` : 'Not started';
 let ht = (m.ht && m.ht.home!=null) ? `${m.ht.home} - ${m.ht.away}` : 'No HT data';
 let htft = (m.ht && m.status==='finished') ? `${m.ht.home}-${m.ht.away} / ${m.home.score}-${m.away.score}` : '-';
 document.getElementById('modalBox').innerHTML=`
  <div class="tab"><div class="active" onclick="showTab('res',this)">Results</div><div onclick="showTab('stand',this)">Standings</div><div onclick="showTab('htft',this)">HT FT</div></div>
  <div class="content" id="tabRes">
   <h3 style="text-align:center">${m.home.name} vs ${m.away.name}</h3>
   <p style="text-align:center;color:#81c784;margin:6px 0">${m.league.country} - ${m.league.name}<br>${m.status} ${m.time? '• '+getLocalTime(m.time):''}</p>
   <div style="background:#0b140b;padding:14px;border-radius:12px;margin-top:10px">
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Full Time:</span><b style="color:#00e676;font-size:18px">${ft}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #1e331e"><span>Half Time:</span><b style="color:#ff9800;font-size:18px">${ht}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #1e331e"><span>HT / FT:</span><b style="color:#fff">${htft}</b></div>
   </div>
   <div class="btn" onclick="loadStand('${m.league.id||m.league.name}')">View Table → Standings clickable</div>
  </div>
  <div class="content" id="tabStand" style="display:none">Loading standings...</div>
  <div class="content" id="tabHtft" style="display:none"><h4>HT FT Results History</h4><p>FT: ${ft}<br>HT: ${ht}<br>HT/FT combo: ${htft}</p><p style="color:#81c784;margin-top:10px">This match HT-FT market result is <b>${htft}</b></p></div>
 `;
 document.getElementById('modal').style.display='flex';
 loadStand(m.league.id||m.league.name, true);
}
function showTab(t,el){
 document.querySelectorAll('.tab div').forEach(d=>d.classList.remove('active')); el.classList.add('active');
 document.getElementById('tabRes').style.display= t==='res'?'block':'none';
 document.getElementById('tabStand').style.display= t==='stand'?'block':'none';
 document.getElementById('tabHtft').style.display= t==='htft'?'block':'none';
}
async function loadStand(leagueId, auto){
 if(!auto) showTab('stand',document.querySelectorAll('.tab div')[1]);
 let box=document.getElementById('tabStand'); if(!box) return;
 box.innerHTML='Loading standings...';
 try{
  let r=await fetch(`/api/standings?league=${encodeURIComponent(leagueId)}&date=${curDate}`);
  let j=await r.json();
  if(j.data?.length){box.innerHTML=j.data.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e331e"><span>${i+1}. ${s.team}</span><span>${s.points} pts</span></div>`).join('');}
  else{box.innerHTML='<div style="padding:20px;text-align:center">Standings clickable - Add your API for table<br><small>API: /api/standings?league=ID</small></div>';}
 }catch{box.innerHTML='Standings will show here - connect your standings API';}
}
function closeModal(){document.getElementById('modal').style.display='none';}
loadDays(); loadMatches();
</script>
</body>
</html>
