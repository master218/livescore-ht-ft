<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore HT-FT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1a0a;color:#fff;font-family:Arial}
.ad-top{background:#00ff88;color:#000;padding:12px;text-align:center;font-weight:700}
.days{display:flex;gap:6px;padding:10px;overflow:auto}
.day{flex:1;padding:10px;background:#1a2a1a;border-radius:10px;text-align:center;cursor:pointer;border:1px solid #333;min-width:80px}
.day.active{background:#00ff55;color:#000;font-weight:700}
.filters{display:flex;gap:6px;padding:10px}
.filter{padding:7px 14px;background:#1a2a1a;border-radius:20px;border:1px solid #333;font-size:13px;cursor:pointer}
.filter.active{background:#fff;color:#000}
.ad-mid{border:1px dashed #00ff55;margin:10px;padding:12px;text-align:center;color:#00ff55;border-radius:8px}
.league{background:#001a00;padding:10px;font-weight:700;display:flex;justify-content:space-between}
.match{display:flex;justify-content:space-between;padding:13px 10px;border-bottom:1px solid #122212;cursor:pointer}
.time{color:#00ff88;width:55px;font-weight:700}
.teams{flex:1;padding-left:10px;line-height:1.4}
.score{color:#00ff88;font-weight:700;min-width:60px;text-align:right}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:999}
#modalBox{background:#0f2a0f;border:2px solid #00ff55;border-radius:16px;width:92%;max-width:360px;padding:20px}
.htft-title{text-align:center;font-size:22px;font-weight:700}
.mTitle{text-align:center;font-size:18px;font-weight:700;margin-top:10px}
.mLeague,.mTime{text-align:center;color:#88ff88;margin:6px 0}
.box{background:#1a1a1a;border-radius:12px;padding:15px;margin-top:12px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #333}
.ftVal{color:#00ff88;font-weight:700}
.htVal{color:#ffaa00;font-weight:700}
</style>
</head>
<body>
<div class="ad-top">AD ON TOP - CLICK</div>
<div style="padding:10px;background:#001a00;font-weight:700">⚽ LiveScore HT-FT <span style="float:right;font-size:11px">TOP 1-10 FIRST</span></div>
<div class="days" id="days"></div>
<div class="filters">
<div class="filter active" onclick="setFilter('all',this)">All</div>
<div class="filter" onclick="setFilter('finished',this)">Finished</div>
<div class="filter" onclick="setFilter('top',this)">Top 1-10 + A-Z</div>
</div>
<div class="ad-mid">AD MID - CLICK</div>
<div id="list"></div>
<div id="modal" onclick="if(event.target===this)this.style.display='none'">
<div id="modalBox">
<div class="htft-title">HT-FT</div>
<div class="mTitle" id="mTitle"></div>
<div class="mLeague" id="mLeague"></div>
<div class="mTime" id="mTime"></div>
<div class="box">
<div class="row"><span>FT:</span><span class="ftVal" id="mFT"></span></div>
<div class="row"><span>HT:</span><span class="htVal" id="mHT"></span></div>
</div>
</div>
</div>
<script>
var curDate = new Date().toISOString().split('T')[0];
var allMatches = [];
function getPriority(league){
  var n=(league.name||'').toLowerCase();
  var c=(league.country||'').toLowerCase();
  if(n.indexOf('premier league')>-1&&c.indexOf('england')>-1) return 0;
  if(c.indexOf('england')>-1) return 1;
  if(c.indexOf('france')>-1) return 2;
  if(c.indexOf('germany')>-1) return 3;
  if(c.indexOf('spain')>-1) return 4;
  if(c.indexOf('italy')>-1) return 5;
  return 90;
}
function loadDays(){
  var html='';
  for(var i=-3;i<=1;i++){
    var d=new Date(); d.setDate(d.getDate()+i);
    var iso=d.toISOString().split('T')[0];
    var label='Today'; if(i===-1)label='Yesterday'; if(i===-2)label='Fri'; if(i===-3)label='Thu'; if(i===1)label='Tomorrow';
    var disp=(d.getMonth()+1)+'-'+d.getDate();
    var act=(iso===curDate)?' active':'';
    html+='<div class="day'+act+'" onclick="setDay(\''+iso+'\',this)">'+label+'<br>'+disp+'</div>';
  }
  document.getElementById('days').innerHTML=html;
}
function setDay(date,el){
  curDate=date;
  var days=document.querySelectorAll('.day');
  for(var i=0;i<days.length;i++)days[i].classList.remove('active');
  el.classList.add('active');
  loadMatches();
}
function setFilter(f,el){
  var fs=document.querySelectorAll('.filter');
  for(var i=0;i<fs.length;i++)fs[i].classList.remove('active');
  el.classList.add('active');
  renderList(f);
}
async function loadMatches(){
  document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';
  try{
    var r=await fetch('/matches?date='+curDate);
    var j=await r.json();
    allMatches=(j.data&&j.data.matches)?j.data.matches:[];
    renderList('all');
  }catch(e){
    document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">No matches</div>';
  }
}
function renderList(filter){
  var list=allMatches;
  list.sort(function(a,b){
    var pa=getPriority(a.league),pb=getPriority(b.league);
    if(pa!==pb)return pa-pb;
    return a.ts-b.ts;
  });
  var html='',lastLeague='',countMap={};
  for(var i=0;i<list.length;i++){var k=list[i].league.country+' - '+list[i].league.name;countMap[k]=(countMap[k]||0)+1;}
  for(var i=0;i<list.length;i++){
    var m=list[i];
    var leagueKey=m.league.country+' - '+m.league.name;
    if(leagueKey!==lastLeague){
      var prio=getPriority(m.league);
      var tag=prio<10?' <span style="background:#00ff88;color:#000;padding:2px 8px;border-radius:10px;font-size:11px">TOP '+(prio+1)+'</span>':'';
      html+='<div class="league"><span>'+leagueKey+tag+'</span><span>('+countMap[leagueKey]+')</span></div>';
      lastLeague=leagueKey;
    }
    var ftH=m.ft_home; if(ftH==null&&m.home)ftH=m.home.score;
    var ftA=m.ft_away; if(ftA==null&&m.away)ftA=m.away.score;
    if(ftH==null||ftA==null){ftH=0;ftA=0;}
    var ft=ftH+' - '+ftA;
    if(String(ft).indexOf('null')>-1)ft='0 - 0';
    html+='<div class="match" onclick="openHTFT(\''+m.id+'\')"><div class="time">'+m.time+'</div><div class="teams">'+m.home.name+'<br>'+m.away.name+'</div><div class="score">'+ft+'</div></div>';
  }
  document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center">No matches for '+curDate+'</div>';
}
function openHTFT(id){
  var m=null;for(var i=0;i<allMatches.length;i++){if(String(allMatches[i].id)===String(id)){m=allMatches[i];break;}}
  if(!m)return;
  var time=m.time||'15:00';
  var ftH=m.ft_home; if(ftH==null&&m.home)ftH=m.home.score; if(ftH==null)ftH=0;
  var ftA=m.ft_away; if(ftA==null&&m.away)ftA=m.away.score; if(ftA==null)ftA=0;
  var htH=m.ht_home; if(htH==null)htH=0;
  var htA=m.ht_away; if(htA==null)htA=0;
  document.getElementById('mTitle').textContent=m.home.name+' vs '+m.away.name;
  document.getElementById('mLeague').textContent=m.league.country+' - '+m.league.name;
  document.getElementById('mTime').textContent='Time: '+time;
  document.getElementById('mFT').textContent=ftH+' - '+ftA;
  document.getElementById('mHT').textContent=htH+' - '+htA;
  document.getElementById('modal').style.display='flex';
}
loadDays();
loadMatches();
</script>
</body>
</html>
