<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore HT-FT TOP 1-10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070e07;color:#fff;font-family:Arial}
.ad-top{position:sticky;top:0;z-index:200;background:#00c853;color:#000;padding:12px;text-align:center;font-weight:900;display:block;text-decoration:none}
.ad-mid{background:#0f1f0f;border:1px dashed #00e676;margin:8px;padding:12px;text-align:center;color:#00e676;border-radius:8px;display:block;text-decoration:none;font-weight:700}
header{position:sticky;top:42px;z-index:100;background:#0a130a;border-bottom:2px solid #00c853;padding:8px}
.logo{font-weight:900;color:#00e676;font-size:18px}
.days{display:flex;gap:6px;overflow:auto;padding:8px 0}
.day{min-width:76px;padding:8px 4px;background:#122112;border-radius:10px;text-align:center;cursor:pointer;border:1px solid #1d331d;flex-shrink:0}
.day.active{background:#00c853;color:#000;font-weight:800}
.fbtn{padding:7px 13px;background:#162616;border-radius:20px;cursor:pointer;border:1px solid #244524;font-size:13px}
.fbtn.active{background:#fff;color:#000;font-weight:700}
.leagueHead{padding:10px;margin-top:10px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;cursor:pointer}
.leagueHead.top{background:#123212;border-left:4px solid #00e676}
.leagueHead.other{background:#0e1e0e;border-left:4px solid #555}
.match{display:flex;align-items:center;padding:12px 8px;background:#111f11;margin:1px 0;cursor:pointer}
.timeCol{width:75px;font-size:14px;color:#a5d6a7;text-align:center;font-weight:900}
.teamCol{flex:1;padding-left:10px}
.scoreCol{min-width:60px;text-align:right;font-weight:900;color:#00e676}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;justify-content:center;align-items:center;padding:12px}
#modalBox{background:#0f1f0f;border:2px solid #00c853;border-radius:14px;width:100%;max-width:420px}
</style>
</head>
<body>
<a class="ad-top" href="https://t.me/yourlink" target="_blank">AD ON TOP - CLICK</a>
<header>
<div class="logo">⚽ LiveScore HT-FT <span style="float:right;font-size:11px">TOP 1-10 FIRST, THEN A-Z</span></div>
<div class="days" id="days"></div>
<div style="display:flex;gap:6px;overflow:auto;padding:8px 0">
<div class="fbtn active" onclick="setF('all',this)">All</div>
<div class="fbtn" onclick="setF('live',this)">Live</div>
<div class="fbtn" onclick="setF('finished',this)">Finished</div>
<div class="fbtn" onclick="loadMatches()">↻</div>
<select id="sortSel" onchange="render()" style="background:#162616;color:#fff;border-radius:8px;padding:6px"><option value="top" selected>Top 1-10 + A-Z</option><option value="all">All Leagues A-Z</option></select>
</div>
</header>
<a class="ad-mid" href="https://t.me/yourlink" target="_blank">AD MID - CLICK</a>
<div id="list"></div>
<a class="ad-mid" href="https://t.me/yourlink" target="_blank">AD BOTTOM - CLICK</a>
<div id="modal" onclick="if(event.target==this)closeModal()"><div id="modalBox"></div></div>

<script>
let curDate=new Date().toISOString().split('T')[0],filter='all',allMatches=[];

function getTopRank(m){
  let n=(m.league.name||'').toLowerCase();
  if(n.includes('u18')||n.includes('u19')||n.includes('u21')||n.includes('u23')||n.includes('youth')||n.includes('women')||n.includes('reserve')||n.includes(' ii')||n.includes(' 2')) return 99;
  if(n.includes('caf')||n.includes('afc')) return 99;
  let c=(m.league.country||'').toLowerCase();
  if(n.includes('champions league')) return 0;
  if(n.includes('europa league')&&!n.includes('conference')) return 1;
  if(n.includes('conference league')) return 2;
  if(c==='england'&&n==='premier league') return 3;
  if(c==='france'&&n==='ligue 1') return 4;
  if(c==='germany'&&n==='bundesliga') return 5;
  if(c==='italy'&&n==='serie a') return 6;
  if(n.includes('laliga')||n==='la liga') return 7;
  if(n.includes('eredivisie')) return 8;
  if(n.includes('primeira liga')||n.includes('liga portugal')) return 9;
  return 99;
}

function loadDays(){
  let h='';
  for(let i=-4;i<=4;i++){
    let dt=new Date();dt.setDate(dt.getDate()+i);
    let iso=dt.toISOString().split('T')[0];
    let label=i==-1?'Yesterday':i==0?'Today':i==1?'Tomorrow':dt.toLocaleDateString('en',{weekday:'short'});
    h+='<div class="day '+(iso===curDate?'active':'')+'" onclick="pickDate(\''+iso+'\')"><b>'+label+'</b><br><small>'+iso.slice(5)+'</small></div>';
  }
  document.getElementById('days').innerHTML=h;
}
function pickDate(iso){curDate=iso;loadDays();loadMatches();}
function setF(f,el){filter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}

async function loadMatches(){
  document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center;color:#66bb6a">Loading '+curDate+'...</div>';
  try{
    let r=await fetch('/api/matches?date='+curDate);
    let j=await r.json();
    allMatches=j.data.matches||[];
  }catch(e){
    document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center;color:#ff5252">API Error</div>';return;
  }
  render();
}

function render(){
  let sort=document.getElementById('sortSel').value;
  let filtered=allMatches.filter(m=>{
    if(filter==='finished'&&m.status!=='finished')return false;
    if(filter==='live'&&!m.isLive)return false;
    return true;
  });
  let grouped={};
  filtered.forEach(m=>{
    let k=m.league.country+'::'+m.league.name;
    if(!grouped[k])grouped[k]=[];
    grouped[k].push(m);
  });
  let keys=Object.keys(grouped);
  if(sort==='top'){
    let topKeys=keys.filter(k=>getTopRank(grouped[k][0])<10).sort((a,b)=>getTopRank(grouped[a][0])-getTopRank(grouped[b][0]));
    let otherKeys=keys.filter(k=>getTopRank(grouped[k][0])>=10).sort((a,b)=>a.localeCompare(b));
    keys=[...topKeys,...otherKeys];
  } else {
    keys.sort((a,b)=>a.localeCompare(b));
  }
  let html='';
  keys.forEach(k=>{
    let parts=k.split('::');
    let country=parts[0], league=parts[1];
    let ms=grouped[k];
    ms.sort((a,b)=>a.time.localeCompare(b.time));
    let rank=getTopRank(ms[0]);
    let isTop=rank<10;
    let headClass=isTop?'top':'other';
    let badge=isTop?'<span style="background:#00c853;color:#000;padding:2px 7px;border-radius:10px;font-size:10px">TOP '+(rank+1)+'</span>':'<span style="background:#333;padding:2px 7px;border-radius:10px;font-size:10px">A-Z</span>';
    html+='<div class="leagueHead '+headClass+'"><span>'+country+' - '+league+' '+badge+' ('+ms.length+')</span><span>></span></div>';
    ms.forEach(m=>{
      let idx=allMatches.indexOf(m);
      let time=m.time||'-';
      let score=m.status==='finished'?m.home.score+' - '+m.away.score:(m.isLive?m.home.score+' - '+m.away.score:'-');
      html+='<div class="match" onclick="openMatch('+idx+')"><div class="timeCol">'+time+'</div><div class="teamCol"><div>'+m.home.name+'</div><div>'+m.away.name+'</div></div><div class="scoreCol">'+score+'</div></div>';
    });
  });
  document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center">No games</div>';
}

function openMatch(idx){
  let m=allMatches[idx];
  let ft=m.home.score!=null?m.home.score+' - '+m.away.score:'Not finished';
  let ht=m.ht?m.ht.home+' - '+m.ht.away:'No HT yet';
  document.getElementById('modalBox').innerHTML='<div style="padding:12px;background:#162616;text-align:center;font-weight:900">HT-FT</div><div style="padding:14px"><h3 style="text-align:center">'+m.home.name+' vs '+m.away.name+'</h3><p style="text-align:center;color:#81c784;margin:8px 0">'+m.league.country+' - '+m.league.name+'<br>Time: '+m.time+'</p><div style="background:#081208;padding:12px;border-radius:10px"><div style="display:flex;justify-content:space-between;padding:8px 0"><span>FT:</span><b style="color:#00e676;font-size:18px">'+ft+'</b></div><div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #222"><span>HT:</span><b style="color:#ff9800;font-size:18px">'+ht+'</b></div></div></div>';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
loadDays();loadMatches();
</script>
</body>
</html>
